<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multi-DB Select</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b57d0'/%3E%3Cpath fill='white' d='M8 10.5c0-1.4 3.6-2.5 8-2.5s8 1.1 8 2.5v11c0 1.4-3.6 2.5-8 2.5s-8-1.1-8-2.5v-11zm8 3.5c4.4 0 8-1.1 8-2.5S20.4 9 16 9s-8 1.1-8 2.5 3.6 2.5 8 2.5z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">Multi-DB Select</p>
        <h1>Choose SQL servers</h1>
        <p class="lede">
          Pick one or more servers. The same SELECT will run against each
          selected instance.
        </p>
      </header>

      <ol class="steps" aria-label="Progress">
        <li class="is-current">Servers</li>
        <li>Query</li>
        <li>Results</li>
      </ol>

      <section class="panel" aria-labelledby="servers-heading">
        <div class="panel-head">
          <div>
            <h2 id="servers-heading">Servers</h2>
            <p class="panel-copy">Names and current IPs for each Appian SQL host.</p>
          </div>
          <div class="panel-actions">
            <button type="button" class="btn" id="select-all">Select all</button>
            <button type="button" class="btn" id="clear-all">Clear</button>
          </div>
        </div>

        <form id="server-form">
          <ul class="server-list">
            {% for server in servers %}
            <li>
              <label class="server-row">
                <input
                  type="checkbox"
                  name="servers"
                  value="{{ server.id }}"
                  data-host="{{ server.host }}"
                  data-ip="{{ server.ip }}"
                />
                <span class="server-copy">
                  <span class="server-name">{{ server.name }}</span>
                  {% if server.host and server.host != server.name and server.host != server.ip %}
                  <span class="server-host">{{ server.host }}</span>
                  {% endif %}
                </span>
                <span class="server-ip">{{ server.ip }}</span>
              </label>
            </li>
            {% endfor %}
          </ul>
        </form>
      </section>

      <p class="status" id="selection-summary" aria-live="polite">
        No servers selected
      </p>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
